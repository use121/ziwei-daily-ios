name: ZiWeiDaily
options:
  bundleIdPrefix: com.ziweidaily
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZiWeiCore:
    path: .
targets:
  ZiWeiDaily:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    path: App/ZiWeiDaily
    sources:
      - path: App/ZiWeiDaily
    resources:
      - path: App/ZiWeiDaily/Resources/Assets.xcassets
    dependencies:
      - package: ZiWeiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ziweidaily.5Y7JPFB56Q
        PRODUCT_NAME: ZiWeiDaily
        PRODUCT_MODULE_NAME: ZiWeiDaily
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 4
        DEVELOPMENT_TEAM: 5Y7JPFB56Q
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 紫微日常
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
schemes:
  ZiWeiDaily:
    build:
      targets:
        ZiWeiDaily: all
    run:
      config: Debug
    archive:
      config: Release
